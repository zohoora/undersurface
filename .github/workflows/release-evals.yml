name: Release model evals

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true
  schedule:
    - cron: '17 9 * * 1'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run pinned release eval suite
        run: npm run test:release-evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRISIS_EVAL_MODEL: gpt-5-nano

      - name: Archive model, prompt hash, results, latency, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evals-${{ github.run_id }}
          path: .artifacts/model-evals/
          if-no-files-found: error
          retention-days: 90
